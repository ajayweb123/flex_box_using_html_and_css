<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .header{
            width: 500px;
            height: 100px;
            background-color: rgb(187, 171, 127);
            display: flex;
            text-align: center;
             justify-content: center;
             margin-bottom: 8px;
        }
        .box{
            width: 500px;
            height: 250px;
             display: flex;
            gap: 12px;
        }
        .sidebar1{
            width: 125px;
            height: 250px;
            background-color: rgb(187, 171, 127);
            display: flex;
         align-items: center;
         justify-content: center;
        }
        .article{
            width: 250px;
            height: 250px;
            background-color:rgb(187, 171, 127);
             display: flex;
         align-items: center;
         justify-content: center;
        }
        .sidebar2{
            width: 125px;
            height: 250px;
            background-color: rgb(187, 171, 127);
             display: flex;
         align-items: center;
         justify-content: center;
        }
        .footer{
            height: 100px;
            width: 500px;
            background-color: rgb(187, 171, 127);
             display: flex;
             align-items: center;
             justify-content: center;
             margin-top: 8px;
            
        }
    </style>
</head>
<body>
    <div class="header"><h1>Header</h1></div>
    <div class="box">
        <div class="sidebar1"> <h1>Sidebar1</h1></div>
        <div class="article"><h1>Article</h1></div>
        <div class="sidebar2"><h1>Sidebar2</h1></div>
    </div>
    <div class="footer"><h1>Footer</h1> </div>
</body>
</html>
